syntax = "proto3";

package netease.music.v1;

import "netease/music/v1/song.proto";

option go_package = "github.com/VOD-Studio/kite/gen/go/netease/music/v1;mmpb";

// MV 域(issue #32)。
//
// 第一阶段只有消息建模,MvService rpc 在第二阶段接入;endpoint 声明
// (internal/netease/endpoint/mv)与 CLI(kite mv)已先用这些消息。
//
// 上游现状(2026-10 实测):
// - 独立的 /mv/url 接口已下线(weapi / eapi 均业务 404),多清晰度播放地址
//   由 /mv/detail 的 brs 字段返回(见 Mv.urls);
// - MV 排行的现行接口是 /mv/toplist(老 /top/mv 已业务 404)。

// Mv 是一个 MV。列表类接口(排行 / 相关 / 收藏)只填摘要字段,
// 统计与播放地址仅详情接口返回。
message Mv {
  // MV ID。
  int64 id = 1;
  // MV 名。
  string name = 2;
  // 歌手列表。
  repeated Artist artists = 3;
  // 主歌手名(上游冗余字段;artists 为空时兜底)。
  string artist_name = 4;
  // 封面 URL。
  string cover_url = 5;
  // 播放数。
  int64 play_count = 6;
  // 时长毫秒(排行榜条目上游恒为 0:时长在视频档位上,顶层不返回)。
  int64 duration_ms = 7;
  // 发行日期 YYYY-MM-DD(详情 / 排行榜返回,相关 MV 列表为空)。
  string publish_time = 8;
  // 简介(仅详情)。
  string brief_desc = 9;
  // 收藏数(仅详情)。
  int64 sub_count = 10;
  // 分享数(仅详情)。
  int64 share_count = 11;
  // 点赞数(仅详情)。
  int64 like_count = 12;
  // 评论数(仅详情)。
  int64 comment_count = 13;
  // 多清晰度播放地址(仅详情;brs,完整带签名 URL,有时效)。
  repeated MvUrl urls = 14;
  // 上期排名(仅排行榜;0 表示新入榜)。
  int32 last_rank = 15;
  // 排行分(仅排行榜)。
  int32 score = 16;
}

// MvUrl 是一个清晰度的 MV 播放地址。
message MvUrl {
  // 垂直分辨率(240 / 480 / 720 / 1080)。
  int32 resolution = 1;
  // 播放地址(详情接口为完整带签名 URL)。
  string url = 2;
}

// GetMv 请求(/mv/detail)。
message GetMvRequest {
  // MV ID。
  int64 mv_id = 1;
}

// GetMv 响应。
message GetMvResponse {
  // MV 详情(含多清晰度播放地址)。
  Mv mv = 1;
}

// SimilarMvs 请求(/simi/mv)。
message SimilarMvsRequest {
  // MV ID。
  int64 mv_id = 1;
}

// SimilarMvs 响应。
message SimilarMvsResponse {
  // 相关 MV 列表。
  repeated Mv mvs = 1;
}

// TopMvs 请求(/top/mv 的现行形态 /mv/toplist;上游无分页参数,恒返回全榜)。
message TopMvsRequest {}

// TopMvs 响应。
message TopMvsResponse {
  // 榜单条目(实测全榜 50 条)。
  repeated Mv mvs = 1;
  // 是否还有更多。
  bool has_more = 2;
  // 榜单更新时间(毫秒时间戳)。
  int64 update_time_ms = 3;
}

// SubscribedMvs 请求(/mv/sublist,需登录态)。
message SubscribedMvsRequest {
  // 每页数量(<=0 时按上游默认 25)。
  int32 limit = 1;
  // 偏移量。
  int32 offset = 2;
}

// SubscribedMvs 响应。
message SubscribedMvsResponse {
  // 收藏的 MV 列表。
  repeated Mv mvs = 1;
  // 是否还有更多。
  bool has_more = 2;
}
