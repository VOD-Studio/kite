# kite 配置示例
#
# 注意：服务目前只从环境变量加载配置，没有读取本文件的代码——这里列出各字段及其含义，
# 对应的环境变量格式为 KITE_{MODULE}_{FIELD}（见 config/config.go 的 Load）。
# 例如：KITE_SERVER_HTTP_ADDR=127.0.0.1:9091

server:
  # gRPC / REST 监听地址。默认只绑本机回环;改成对外地址时必须同时配置访问令牌,
  # 否则服务拒绝启动(见 docs/server-security.md)。
  grpc_addr: "127.0.0.1:3722"
  http_addr: "127.0.0.1:3721"
  # 访问令牌(bearer)。与 auth_token_file 互斥;建议用文件,避免出现在进程环境里。
  auth_token: ""
  auth_token_file: ""
  # 运行环境：dev（彩色文本日志）/ prod（JSON 日志）
  env: dev

provider:
  # 调用网易云上游的超时时间（秒）
  upstream_timeout: 10
  # 调用上游失败后的最大重试次数
  max_retries: 3

redis:
  # Redis 主机地址
  host: localhost
  # Redis 端口
  port: 6379
  # Redis 密码，无密码时为空
  password: ""
  # Redis 数据库编号（用 DB 1 避免和 mimo-blog DB 0 冲突）
  db: 1

worker:
  # worker 并发处理的任务数
  concurrency: 5
  # Cookie 健康检查轮询间隔（小时）
  cookie_check_interval: 6

otel:
  # exporter 类型：none（noop，本地开发默认）/ otlp-grpc / otlp-http
  exporter: none
  # OTLP collector 地址（仅 exporter 非 none 时生效）
  # otlp-grpc 默认端口 4317，otlp-http 默认端口 4318
  endpoint: "localhost:4317"
  # 上报到后端的服务名
  service_name: kite
  # 根 span 采样率，0.0-1.0，1.0 表示全采样
  sample_ratio: 1.0
