name: Release Please

# release-please 从 Conventional Commits 自动推导版本号 + 维护 CHANGELOG.md + 打 tag。
# 工作流:push 到 main → release-please 开「release PR」(含待发 changelog)→
# 维护者 review 后合并 → 自动打 tag → 本 workflow 内直接调用 release.yml 构建产物。
#
# 为什么在同一个 workflow 里调用,而不是靠 tag 事件触发 release.yml:
# release-please 用 GITHUB_TOKEN 打 tag,GitHub 规定 GITHUB_TOKEN 触发的事件不会再触发
# 其它 workflow,`on: push: tags` 因此永远收不到(v0.2.0 / v0.2.1 的产物数为 0 即由此而来)。
# 用 outputs.release_created 串联既不需要 PAT,也不依赖 tag 事件。
#
# v0.x 阶段:BREAKING CHANGE 只 bump minor(semver 0.x 规则)。

on:
  push:
    branches: [main]
  workflow_dispatch:   # 手动重跑(例如排查 release PR 上的检查状态)

permissions:
  contents: write       # 创建 release PR + 打 tag
  pull-requests: write  # 开/合并 release PR

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # 创建 release PR + 打 tag
      pull-requests: write  # 开/合并 release PR
      actions: write        # 批准 release PR 上等待批准的 CI 运行
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          release-type: go
          # 仓库已存在 CHANGELOG.md(v0.1.0 段),release-please 会接续维护而非覆盖
          bootstrap-changelog: false
          # v0.x:允许 breaking change 被处理(默认就是 minor bump,无需特殊配置)
          changelog-types: |
            [
              {"type":"feat","section":"Features","hidden":false},
              {"type":"fix","section":"Bug Fixes","hidden":false},
              {"type":"perf","section":"Performance","hidden":false},
              {"type":"refactor","section":"Refactoring","hidden":false},
              {"type":"docs","section":"Documentation","hidden":true},
              {"type":"chore","section":"Miscellaneous","hidden":true},
              {"type":"test","section":"Tests","hidden":true}
            ]

      # 批准 release PR 上等待批准的 CI 运行。
      #
      # release PR 由 github-actions[bot] 创建 / 更新,仓库「首次贡献者需批准」的策略把它当作首次贡献者,
      # 它的 pull_request CI 会停在 action_required。实测:即使另外 workflow_dispatch 出一个成功的
      # CI OK,只要 PR 上还挂着等待批准的运行,required check CI OK 就视为未满足,PR 保持 BLOCKED。
      # 这个 PR 是我们自己的 workflow 生成的,批准它是安全的(不放宽仓库的批准策略)。
      #
      # 每次都运行(不依赖 prs_created):幂等,只批准当前打开的 release PR 头部提交上的待批准运行。
      # pull_request 事件在 push 之后才异步产生运行,所以轮询等待最多约 1 分钟。
      - name: 批准 release PR 上等待批准的 CI 运行
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ (steps.rp.outputs.pr && fromJSON(steps.rp.outputs.pr).headBranchName) || 'release-please--branches--main' }}
        run: |
          head=$(gh pr list --head "${BRANCH}" --state open --json headRefOid --jq '.[0].headRefOid // empty')
          if [ -z "${head}" ]; then
            echo "没有打开的 release PR,跳过"
            exit 0
          fi
          for i in $(seq 1 6); do
            pending=$(gh run list --branch "${BRANCH}" --event pull_request --limit 20 \
              --json databaseId,headSha,conclusion \
              --jq ".[] | select(.headSha == \"${head}\" and .conclusion == \"action_required\") | .databaseId")
            if [ -n "${pending}" ]; then
              while read -r id; do
                echo "批准运行 ${id}"
                gh api -X POST "repos/${GH_REPO}/actions/runs/${id}/approve"
              done <<<"${pending}"
              exit 0
            fi
            echo "[${i}/6] 暂无等待批准的运行,10 秒后重试"
            sleep 10
          done
          echo "未发现等待批准的运行(可能已被批准,或策略不再要求批准)"

  # 仅在本次运行真的创建了 release(即 release PR 被合并)时才发布产物。
  # caller 需授予被调用 workflow 所需权限的超集。
  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      checks: read
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
