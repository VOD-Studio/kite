name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue rather than replace pending runs; a release-PR merge must not be lost.
concurrency:
  group: release-please
  queue: max

permissions:
  contents: read

jobs:
  release-please:
    if: github.repository == 'VOD-Studio/kite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Ensure trusted release PR CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/release-pr-ci.sh

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # Recovery: dispatch BSR or Deploy on main with the already-public tag.
  bsr:
    needs: [release-please, release]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/bsr.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}

  deploy:
    needs: [release-please, release]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    # 即使仅存在于 environment,复用工作流也要求调用方逐项传递同名 secret。
    secrets:
      KITE_PRODUCTION_SSH_KEY: ${{ secrets.KITE_PRODUCTION_SSH_KEY }}
      KITE_PRODUCTION_KNOWN_HOSTS: ${{ secrets.KITE_PRODUCTION_KNOWN_HOSTS }}
      KITE_PRODUCTION_HOST: ${{ secrets.KITE_PRODUCTION_HOST }}
      KITE_PRODUCTION_PORT: ${{ secrets.KITE_PRODUCTION_PORT }}
