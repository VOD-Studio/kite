name: npm

on:
  workflow_call:
    inputs:
      tag:
        description: Player release tag whose exact main CI tarball will be published
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        description: Explicit binding required even when the value exists only in the npm environment
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Recover player-vX.Y.Z; old sources can only finalize already-published identical bytes
        required: true
        type: string

# Do not drop pending versions or cancel an in-flight npm publication.
concurrency:
  group: npm-publish
  queue: max

permissions:
  contents: read

jobs:
  publish:
    name: Publish @violetjs/kite-player
    runs-on: ubuntu-24.04
    environment: npm
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      # Checkout the trusted caller commit, not a user-supplied tag. The publisher
      # checks main authorization and refuses provenance for any other source SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Authorize exact CI producer and verify its tested package
        id: package
        run: python3 scripts/npm-release.py prepare

      - name: Load tool versions from Makefile
        if: steps.package.outputs.publish == 'true'
        run: make -s ci-env >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.package.outputs.publish == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      # No install/build/pack here: publish the identical tarball consumed by CI.
      # The npm credential is unavailable to authorization, download and recovery.
      - name: Publish verified bytes with matching-source provenance
        if: steps.package.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: python3 scripts/npm-release.py publish

      - name: Verify registry bytes and make the player release public (never Latest)
        run: python3 scripts/npm-release.py finalize
