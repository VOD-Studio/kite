name: Deploy

# 合并 release PR 后自动部署;手动入口用于指定版本重试或回滚。
# 只允许 main 的工作流取得 production 环境凭据。主机部署器由管理员独立安装,
# 日常部署先检查版本,再经受限 SSH 入口验签、替换、探活;失败恢复旧镜像。
on:
  workflow_call:
    inputs:
      tag:
        description: 已发布的正式版本(如 v0.4.0)
        required: true
        type: string
      automatic:
        description: 自动发布只部署最新 Go 正式版本;旧版本须显式手动回滚
        type: boolean
        default: true
    secrets:
      KITE_PRODUCTION_SSH_KEY:
        required: true
      KITE_PRODUCTION_KNOWN_HOSTS:
        required: true
      KITE_PRODUCTION_HOST:
        required: true
      KITE_PRODUCTION_PORT:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 已发布的正式版本;填旧版本按已记录制品回滚
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  prepare:
    name: 校验部署来源与版本
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source-sha: ${{ steps.release.outputs.sha }}
      deployer-version: ${{ steps.version.outputs.required }}
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - name: 限制工作流来源
        run: |
          if [ "$GITHUB_REPOSITORY" != VOD-Studio/kite ] || [ "$GITHUB_REF" != refs/heads/main ]; then
            echo '::error::生产部署只能从 VOD-Studio/kite 的 main 工作流执行'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 校验已公开版本与主干来源
        id: release
        env:
          TAG: ${{ inputs.tag }}
          AUTOMATIC: ${{ inputs.automatic || false }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deploy-target.py >> "$GITHUB_OUTPUT"
      - name: 读取最低部署器版本
        id: version
        run: |
          required=$(cat scripts/deploy-version)
          [[ "$required" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::部署器版本文件无效'; exit 1; }
          echo "required=$required" >> "$GITHUB_OUTPUT"

  deploy:
    name: 部署 ${{ inputs.tag }}
    needs: prepare
    if: needs.prepare.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: 检查安装版本并部署
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
          REQUIRED_VERSION: ${{ needs.prepare.outputs.deployer-version }}
          SSH_KEY: ${{ secrets.KITE_PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KITE_PRODUCTION_KNOWN_HOSTS }}
          HOST: ${{ secrets.KITE_PRODUCTION_HOST }}
          PORT: ${{ secrets.KITE_PRODUCTION_PORT }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$HOST" ]; then
            echo '::error::production 环境缺少部署凭据;拒绝把未部署报告为成功。见 docs/deploy.md'
            exit 1
          fi
          command -v ssh >/dev/null
          dir=$(mktemp -d "$RUNNER_TEMP/kite-deploy.XXXXXX")
          trap 'rm -rf "$dir"' EXIT
          (umask 077 && printf '%s\n' "$SSH_KEY" >"$dir/key" && printf '%s\n' "$KNOWN_HOSTS" >"$dir/known_hosts")
          ssh_command=(ssh -i "$dir/key" -p "${PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$dir/known_hosts"
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 "kite-deploy@$HOST")
          installed=$("${ssh_command[@]}" version </dev/null) || {
            echo "::error::服务器没有版本化部署器。请管理员安装至少 $REQUIRED_VERSION;旧服务未替换"
            exit 1
          }
          [[ "$installed" =~ ^kite-deployer\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo '::error::无法识别服务器部署器版本'; exit 1; }
          installed=${BASH_REMATCH[1]}
          if ! printf '%s\n%s\n' "$REQUIRED_VERSION" "$installed" | sort --version-sort --check=quiet; then
            echo "::error::部署器 $installed 低于要求 $REQUIRED_VERSION;请管理员更新安装包,旧服务未替换"
            exit 1
          fi
          printf -v image_ref 'ghcr.io/vod-studio/kite-server:%s' "$TAG"
          printf '%s\n' "$REGISTRY_TOKEN" | "${ssh_command[@]}" "$image_ref"
          {
            echo "### 已部署 $TAG"
            echo "- 制品源码提交: $SOURCE_SHA"
            echo "- 工作流提交: $GITHUB_SHA"
            echo "- 部署器: $installed"
            echo '- 镜像 index 与部署结果见 SSH 输出;平台 digest 等完整记录保存在服务器的 deploy-history.json。'
          } >> "$GITHUB_STEP_SUMMARY"
