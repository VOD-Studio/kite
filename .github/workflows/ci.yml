# The planner owns the task registry; CI OK independently reconstructs its plan.
# Do not filter edited events: a title edit must rerun every applicable code check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    name: Change Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      tasks: ${{ steps.plan.outputs.tasks }}
      security_modules: ${{ steps.plan.outputs.security_modules }}
      pr_number: ${{ steps.plan.outputs.pr_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-python
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-plan.py plan

  control:
    name: Control Plane
    needs: plan
    if: fromJSON(needs.plan.outputs.tasks).control
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/ci-python
      - run: make scripts-check

  go-quality:
    name: Go Quality
    needs: plan
    if: fromJSON(needs.plan.outputs.tasks).go-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: make fmt-check tidy-check
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout 5m

  go-test:
    name: Go Test (${{ matrix.os }})
    needs: plan
    if: fromJSON(needs.plan.outputs.tasks).go-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: go build ./...
      - run: make vet test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: coverage-${{ github.run_attempt }}
          path: coverage.out
          if-no-files-found: error

  windows-vet:
    name: Go Windows Vet
    needs: plan
    if: fromJSON(needs.plan.outputs.tasks).windows-vet
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      # GoReleaser snapshot covers cross-builds; vet also checks Windows tests.
      - run: GOOS=windows GOARCH=amd64 go vet ./...

  player:
    name: Player Source and Package
    needs: plan
    if: fromJSON(needs.plan.outputs.tasks).player
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/kite-player
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Load tool versions
        working-directory: .
        run: make -s ci-env >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/kite-player/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run package:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: kite-player-package-${{ github.run_attempt }}
          path: |
            packages/kite-player/artifacts/kite-player.tgz
            packages/kite-player/artifacts/manifest.json
          if-no-files-found: error
          retention-days: 30

  proto:
    name: Protocol
    needs: plan
    if: fromJSON(needs.plan.outputs.tasks).proto
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
          version: ${{ env.BUF_VERSION }}
      - run: make proto-lint
      - name: Check breaking changes against main
        if: needs.plan.outputs.pr_number != ''
        run: make proto-breaking
      - run: make verify-gen

  go-interop:
    name: Contract Go Consumer
    needs: plan
    if: fromJSON(needs.plan.outputs.tasks).go-interop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      # Consume the public BSR-generated SDK, not locally generated substitutes.
      - run: make interop-go

  rust-interop:
    name: Contract Rust Consumer
    needs: plan
    if: fromJSON(needs.plan.outputs.tasks).rust-interop
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
          version: ${{ env.BUF_VERSION }}
      - name: Install pinned Rust toolchain
        working-directory: interop/rust
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            interop/rust/target
          key: rust-interop-${{ runner.os }}-${{ hashFiles('interop/rust/Cargo.lock', 'interop/rust/rust-toolchain.toml') }}
          restore-keys: rust-interop-${{ runner.os }}-
      # Generate a tonic client and run the documented Rust examples against server.
      - run: make interop-rust

  go-package:
    name: Go Artifacts and Images
    needs: plan
    if: fromJSON(needs.plan.outputs.tasks).go-package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build development image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: kite-server:ci
          cache-from: type=gha,scope=kite-server
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=kite-server' || '' }}
      - name: Smoke development image
        run: scripts/docker-smoke.sh kite-server:ci
      - name: Select Go-only snapshot tags
        run: python3 scripts/go-release-tags.py >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: check
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=docker,sign,sbom,publish
      - name: Build and smoke release image from snapshot binaries
        run: scripts/release-image-smoke.sh

  security:
    name: Dependency Security
    needs: plan
    if: fromJSON(needs.plan.outputs.tasks).security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Load tool versions
        run: make -s ci-env >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
        if: ${{ !cancelled() && contains(needs.plan.outputs.security_modules, 'go') }}
      - name: Install govulncheck
        if: ${{ !cancelled() && contains(needs.plan.outputs.security_modules, 'go') }}
        run: go install golang.org/x/vuln/cmd/"govulncheck@${GOVULNCHECK_VERSION}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: ${{ !cancelled() && contains(needs.plan.outputs.security_modules, 'player') }}
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned Rust scanner
        if: ${{ !cancelled() && contains(needs.plan.outputs.security_modules, 'rust') }}
        working-directory: interop/rust
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
          cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
      - name: Scan all selected dependency scopes
        if: ${{ !cancelled() }}
        env:
          MODULES: ${{ needs.plan.outputs.security_modules }}
          # 新公布的漏洞不阻断无关 PR;每日 scheduled.yml 仍对可修复漏洞失败并开 issue。
          DEPENDENCY_SECURITY_MODE: report
        run: |
          read -r -a modules <<< "$MODULES"
          scripts/dependency-security.sh "${modules[@]}"

  metadata:
    name: PR Metadata
    needs: plan
    if: fromJSON(needs.plan.outputs.tasks).metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate title, release identity, merged versions and atomic commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          PR_BASE_SHA: ${{ fromJSON(needs.plan.outputs.plan).context.baseSha }}
          PR_HEAD_SHA: ${{ fromJSON(needs.plan.outputs.plan).context.headSha }}
        run: scripts/pr-commits.sh

  ci-ok:
    name: CI OK
    if: always()
    needs: [plan, control, go-quality, go-test, windows-vet, player, proto, go-interop, rust-interop, go-package, security, metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-python
      - name: Independently verify plan and every job result
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: scripts/ci-results.sh <<< "$NEEDS"
