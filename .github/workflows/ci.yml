# CI 流水线
#
# PR 和 push 到 main 时触发。所有 job 汇总到唯一的门禁 job「CI OK」:
#   - ruleset 的 required check 只需要它;
#   - 发布流程(release.yml)也只等它,不再维护 job 名字白名单。
# 增减 / 重命名 job 时只需同步 ci-ok 的 needs。
#
# 设计原则:
#   1. 门禁不依赖会自行变化的外部状态(漏洞库、unpinned 插件、latest runner):
#      凡是「没改代码也会变红」的检查,要么固定版本,要么只在相关改动时才拦 PR,
#      全量扫描走 security.yml 定时任务。
#   2. 工具版本唯一来源是 Makefile(.github/actions/setup 读取),workflow 不重复写。
#   3. 检查逻辑放 Makefile / scripts,CI 只负责编排,本地 `make check` 可复现。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    # edited:改 PR 标题要重新校验(PR Title job 依赖标题)。其它 job 也会重跑,
    # 这是刻意的——若只跑 PR Title,新的 CI OK 会覆盖同一 SHA 上先前失败的结果。
    types: [opened, synchronize, reopened, edited]
  # 手动触发入口(Actions 页 Run workflow)。PR 专属步骤(PR Title、proto breaking)在此事件下按条件跳过。
  workflow_dispatch:

# 同一 PR 多次 push 时取消旧的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read   # PR 标题检查

jobs:
  # gofmt / go mod tidy:纯机械漂移,最快暴露
  hygiene:
    name: Hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: make fmt-check
      - run: make tidy-check
      - run: make scripts-check

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # 全量检查,与本地 make check 一致:存量已清零,只看新增会让历史债重新悄悄堆积。
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout 5m

  # CLI 面向 macOS / Linux 用户,终端与路径相关逻辑在两个平台都要跑真实测试
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # build 前置到 vet/test 之前:纯编译错误最快暴露
      - run: go build ./...
      - run: make vet
      - run: make test   # -race + coverage,与本地等价
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: coverage
          path: coverage.out

  # goreleaser 发布 linux/darwin/windows × amd64/arm64,这里提前编译,
  # 避免平台相关的编译错误拖到打 tag 才暴露。Windows 另跑 vet 以类型检查其测试代码。
  cross-build:
    name: Cross build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: CLI 全平台编译
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "→ cmd/kite ${target}"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build -o /dev/null ./cmd/kite
          done
      - name: server 编译(linux/arm64)
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/server
      - name: Windows vet(含测试代码)
        run: GOOS=windows GOARCH=amd64 go vet ./...

  # proto:lint → breaking(仅 PR,对比 main)→ gen/ 漂移。
  # gen/ 已提交且 gRPC/REST 对外,契约破坏必须在合并前暴露。
  proto:
    name: Proto
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # buf breaking 需要 origin/main
      - uses: ./.github/actions/setup
      # buf-setup-action 已归档,统一用 buf-action(setup_only 仅装 CLI),版本取自 Makefile
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: ${{ env.BUF_VERSION }}
      - run: make proto-lint
      - name: Breaking change(对比 main)
        if: github.event_name == 'pull_request'
        run: make proto-breaking
      - run: make verify-gen

  # 依赖漏洞:只在 PR 改动了依赖时才拦(门禁只对「本 PR 引入的变化」负责)。
  # 漏洞库每天都在变,对无关 PR 拦截只会制造噪音;全量扫描见 security.yml(定时)。
  vuln:
    name: Dependency Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: 判断依赖是否变化
        id: deps
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${EVENT}" != "pull_request" ]; then
            echo "非 PR 事件,全量扫描交给 security.yml 定时任务"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "origin/${BASE_REF}" HEAD -- go.mod go.sum scripts/govulncheck-gate.sh; then
            echo "go.mod / go.sum 未变化,跳过(定时任务会全量扫描)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install govulncheck
        if: steps.deps.outputs.changed == 'true'
        run: go install golang.org/x/vuln/cmd/"govulncheck@${GOVULNCHECK_VERSION}"
      - name: govulncheck 门禁
        if: steps.deps.outputs.changed == 'true'
        run: make vuln

  # 根 Dockerfile(本地开发 / 自部署)的构建验证 + 冒烟(安全默认值:无令牌拒绝启动、/healthz、鉴权);
  # Dockerfile.release 由 goreleaser 在发布时构建,ENV 与根 Dockerfile 保持一致(见 docs/server-security.md)。
  docker:
    name: Docker Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write   # buildx type=gha 缓存读写
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: kite-server:ci
          cache-from: type=gha,scope=kite-server
          # 仅主干 push 写缓存:PR 分支命中率低,不写
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=kite-server' || '' }}
      - name: 镜像冒烟
        run: scripts/docker-smoke.sh kite-server:ci

  # Rust 互操作冒烟:服务是给 Rust 等其它语言的项目用的,这里证明「Rust 真的能用」——
  # 用 proto 生成 tonic 客户端,对真实运行的 kite-server 验证鉴权与 ErrorInfo 错误契约,
  # 并编译 / 运行文档里的 Rust 示例。不访问上游网易云。
  rust-interop:
    name: Rust Interop
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: ${{ env.BUF_VERSION }}
      # rustup 1.28+ 不再自动安装 rust-toolchain.toml 指定的工具链,需显式安装
      - name: 安装固定的 Rust 工具链
        working-directory: interop/rust
        run: rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            interop/rust/target
          key: rust-interop-${{ runner.os }}-${{ hashFiles('interop/rust/Cargo.lock', 'interop/rust/rust-toolchain.toml') }}
          restore-keys: rust-interop-${{ runner.os }}-
      - run: make interop-rust

  # Go 互操作冒烟:用 BSR 上生成的 SDK(接入方的真实路径)对真实运行的 kite-server
  # 编译 / 运行 docs/integration.md 的 Go 示例。不访问上游网易云。
  go-interop:
    name: Go Interop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: make interop-go

  # 发布配置的合并前校验:goreleaser 配置错误、跨平台构建失败原本要到打 tag 才暴露。
  # 跳过 docker / 签名 / 发布(需要 buildx、OIDC 与 registry 凭据);镜像构建由 Docker Build job 覆盖。
  release-check:
    name: Release Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # goreleaser 需要完整历史与 tag
      - uses: ./.github/actions/setup
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=docker,sign,sbom,publish

  # squash merge 用 PR 标题作为 main 上的 commit message,release-please 靠它推导版本与
  # CHANGELOG;标题不合规会让该变更静默地不进 changelog、不触发版本号变化。
  pr-title:
    name: PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 与 CONTRIBUTING.md 的 type 列表一致
          types: |
            feat
            fix
            perf
            refactor
            docs
            style
            test
            chore
            build
            ci
            revert
            hotfix
          requireScope: false

  # 唯一门禁:ruleset required check 与发布流程都只认它。
  # skipped 视为通过(pr-title 在 push 事件下被跳过);failure / cancelled 视为失败。
  ci-ok:
    name: CI OK
    if: always()
    needs: [hygiene, lint, test, cross-build, proto, vuln, docker, rust-interop, go-interop, release-check, pr-title]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 汇总各 job 结果
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${NEEDS}"
          bad=$(jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped")] | map(.key) | join(", ")' <<<"${NEEDS}")
          if [ -n "${bad}" ]; then
            echo "::error::以下 job 未通过: ${bad}"
            exit 1
          fi
