name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Draft to complete, or public release to verify without rebuilding
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Retry a draft; public releases are verification-only (never overwrite bytes)
        required: true
        type: string

# Publication and floating-image promotion form one serialized critical section.
concurrency:
  group: release-publication
  queue: max

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'VOD-Studio/kite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      # Tooling always comes from the trusted workflow commit, never the input tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: tooling
          persist-credentials: false
      - id: gate
        name: Validate release authorization and exact main CI producer
        run: python3 tooling/scripts/release-lifecycle.py prepare
      - name: Read pinned tool versions
        run: make -s -C tooling ci-env >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.build == 'true'
        with:
          ref: ${{ steps.gate.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact Go-only current and previous tags
        if: steps.gate.outputs.build == 'true'
        working-directory: source
        run: python3 ../tooling/scripts/go-release-tags.py "$TAG" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: steps.gate.outputs.build == 'true'
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: source/go.sum
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        if: steps.gate.outputs.build == 'true'
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          workdir: source
          args: release --clean --config ../tooling/.goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Package and sign the complete deployer
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          package="kite-deployer_${TAG}.tar.gz"
          python3 tooling/scripts/release-package.py
          cosign sign-blob --yes --bundle "${package}.sigstore.json" "$package"
          # Only draft artifacts can be replaced; the gate never builds public releases.
          gh release upload "$TAG" "$package" "${package}.sigstore.json" --clobber
      - id: verify
        name: Verify downloaded assets, signatures, labels and both published image architectures
        env:
          SOURCE_SHA: ${{ steps.gate.outputs.sha }}
          REQUIRE_PACKAGE: ${{ steps.gate.outputs.build }}
        run: tooling/scripts/release-verify.sh
      - name: Publish only complete artifacts and advance floating image tags
        env:
          SOURCE_SHA: ${{ steps.gate.outputs.sha }}
          VERIFIED_IMAGE: ${{ steps.verify.outputs.image }}
        run: python3 tooling/scripts/release-lifecycle.py publish
