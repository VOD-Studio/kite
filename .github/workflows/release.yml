name: Release

# tag 触发:release-please 合并 release PR 后自动打 tag,此 workflow 负责构建产物。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write       # 上传 GitHub Release 产物
  packages: write       # 推 ghcr.io 镜像
  id-token: write       # cosign keyless 签名(OIDC)
  attestations: write   # GitHub artifact attestations

jobs:
  # ── verify-ci: 发布前校验 tag commit 的主干 CI 全绿(移植 violet deploy 门禁)
  # 合并 release PR 即打 tag 即发布,与主干 CI 并发执行;本 job 轮询等待 CI 完成
  # 并校验结论,拦截「CI 未跑完或失败时被发布」(ruleset required checks 之外的
  # 发布侧兜底,覆盖 admin bypass 强合路径)。
  verify-ci:
    name: Verify main CI green
    runs-on: ubuntu-latest
    # 等待窗口对齐 CI 最长 job timeout(20 分钟):冷缓存时 CI 可能跑满
    timeout-minutes: 25
    permissions:
      checks: read   # 查询 check-runs
    steps:
      - name: 等待并校验主干 CI 全绿
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          # 白名单只列 ci.yml 的 job:本 workflow 自身的 check 同样挂在该 commit
          # 上,必须排除。job 改名或增减时需同步本清单。
          for i in $(seq 1 40); do
            # gh api 瞬断(网络抖动)不等于 CI 失败:跳过当轮继续等
            STATE=$(gh api "repos/${GH_REPO}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "Lint" or .name == "Test" or .name == "Verify gen/ no drift" or .name == "Dependency Security" or .name == "Docker Build") | {status, conclusion: (.conclusion // "pending")}]' || echo '[]')
            TOTAL=$(echo "${STATE}" | jq 'length')
            PENDING=$(echo "${STATE}" | jq '[.[] | select(.status != "completed")] | length')
            echo "[${i}/40] CI checks: ${TOTAL}/5 已注册, ${PENDING} 进行中"
            if [ "${TOTAL}" -ge 5 ] && [ "${PENDING}" -eq 0 ]; then
              BAD=$(echo "${STATE}" | jq -r '[.[] | select(.conclusion != "success" and .conclusion != "skipped")] | map(.conclusion) | join(", ")')
              if [ -z "${BAD}" ]; then
                echo "主干 CI 全绿,放行发布"
                exit 0
              fi
              echo "::error::主干 CI 未通过(${BAD}),中止发布;修复后重发版"
              exit 1
            fi
            sleep 30
          done
          echo "::error::等待主干 CI 超时(20 分钟)。若 CI job 有重命名或增减,需同步本 job 的白名单"
          exit 1

  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: verify-ci
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # GoReleaser 需要完整历史生成 changelog

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 多平台镜像必需:QEMU 模拟 ARM
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # 登录 ghcr.io:GoReleaser 不替你登录 docker registry,必须自己来
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cosign keyless 签名需要 CI 里装 cosign
      - uses: sigstore/cosign-installer@v4.1.0

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
