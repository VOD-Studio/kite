name: Release

# tag 触发:release-please 合并 release PR 后自动打 tag,此 workflow 负责构建产物。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write       # 上传 GitHub Release 产物
  packages: write       # 推 ghcr.io 镜像
  id-token: write       # cosign keyless 签名(OIDC)
  attestations: write   # GitHub artifact attestations

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # GoReleaser 需要完整历史生成 changelog

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 多平台镜像必需:QEMU 模拟 ARM
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # 登录 ghcr.io:GoReleaser 不替你登录 docker registry,必须自己来
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cosign keyless 签名需要 CI 里装 cosign
      - uses: sigstore/cosign-installer@v4.1.2

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
