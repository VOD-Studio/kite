name: BSR

# 把 proto 发布到 Buf Schema Registry(buf.build/vod-studio/kite),让 Rust 等其它语言的项目
# 直接依赖该模块,不必拷贝 .proto 文件。两种入口:
#   - workflow_call:release-please.yml 在产物发布成功后调用(日常路径,tag 为刚发布的版本);
#   - workflow_dispatch:手动补推指定 tag(首次接入时补推已发布的版本,或重试失败的推送)。
#
# 前置(BSR 账号侧,只有 owner 能做):
#   1. 在 buf.build 创建组织 vod-studio;
#   2. 签发 token,存进仓库 secret BUF_TOKEN。
# 未配置 BUF_TOKEN 时只给提示并跳过,不会让发布流程变红。
# 模块(kite)首次推送时自动创建为公开模块——仓库本身是公开的,proto 已经是公开契约。

on:
  workflow_call:
    inputs:
      tag:
        description: 要发布的 tag(如 v0.3.0)
        required: true
        type: string
    secrets:
      BUF_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag(如 v0.3.0)
        required: true
        type: string

# 同一 tag 不并发推送
concurrency:
  group: bsr-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    name: 推送到 BSR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: 检查令牌
        id: gate
        run: |
          if [ -z "${BUF_TOKEN}" ]; then
            echo "::notice title=已跳过::未配置仓库 secret BUF_TOKEN,proto 没有推送到 BSR(见 CONTRIBUTING「CI 约定」)"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.skip != '1'
      - uses: bufbuild/buf-action@v1
        if: steps.gate.outputs.skip != '1'
        with:
          setup_only: true
          version: ${{ env.BUF_VERSION }}
      # main 标签跟随最新发布;版本 tag 标签固定到这次发布的 proto。
      # --create:模块不存在时自动创建;--create-visibility public:仓库是公开的。
      - name: 推送
        if: steps.gate.outputs.skip != '1'
        env:
          TAG: ${{ inputs.tag }}
        run: buf push proto --label main --label "${TAG}" --create --create-visibility public
