name: BSR

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      BUF_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Recover a fixed BSR version from an already-public GitHub Release
        required: true
        type: string

# Keep every pending version (up to GitHub's 100-run queue limit), not just the last.
concurrency:
  group: bsr-publication
  queue: max

permissions:
  contents: read

jobs:
  push:
    if: github.repository == 'VOD-Studio/kite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: tooling
          persist-credentials: false
      - id: gate
        name: Validate public release and resolve immutable source
        run: tooling/scripts/bsr-publish.sh prepare
      - name: Read pinned tool versions
        run: make -s -C tooling ci-env >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.gate.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          setup_only: true
          version: ${{ env.BUF_VERSION }}
      - name: Push immutable version; only latest public version advances main
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
          SOURCE_SHA: ${{ steps.gate.outputs.sha }}
        run: tooling/scripts/bsr-publish.sh push
