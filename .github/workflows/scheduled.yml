# 定时任务:跟踪「没改代码也会变化」的外部状态,与 PR 门禁(ci.yml)解耦。
#
#   - vuln:每日全量 govulncheck。漏洞库更新会让无关 PR 变红,所以 PR 门禁只在依赖变化时才拦
#     (见 ci.yml 的 vuln job),全量扫描放这里;失败时开 / 更新一个 issue 提醒,不阻塞任何 PR。
#   - lint-debt:全量 golangci-lint 的历史债汇总,只报告、不失败。PR 里只拦新增问题
#     (only-new-issues),存量需要有地方可见,否则会被遗忘。

name: Scheduled

on:
  schedule:
    - cron: "17 2 * * *"   # 每天 UTC 02:17(错开整点高峰)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vuln:
    name: Full vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write   # 失败时开 / 更新 issue
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install govulncheck
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      - name: govulncheck 门禁
        id: scan
        run: make vuln
      - name: 失败时开 / 更新 issue
        if: failure() && steps.scan.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="[security] 依赖存在可修复的漏洞"
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          body="定时全量扫描发现可修复的漏洞,详情见运行日志: ${RUN_URL}"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi

  lint-debt:
    name: Lint debt summary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install golangci-lint
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
      - name: 全量 lint 汇总(只报告历史债,不因存量问题失败)
        run: |
          set +e
          out=$("$(go env GOPATH)/bin/golangci-lint" run --timeout 5m ./... 2>&1)
          code=$?
          set -e
          {
            echo "## 全量 lint 历史债"
            echo
            case "${code}" in
              0)
                echo "无问题"
                ;;
              1)
                # exit 1 = 发现问题:先给按 linter 的计数,再附详细诊断
                echo '```'
                grep -E '^\* ' <<<"${out}" || true
                echo '```'
                echo
                echo "<details><summary>详细诊断(前 300 行)</summary>"
                echo
                echo '```'
                head -300 <<<"${out}"
                echo '```'
                echo "</details>"
                ;;
              *)
                # 其它退出码 = 工具自身失败(配置错误 / 编译失败等),不能当成「无问题」
                echo "**golangci-lint 执行失败(exit ${code})**"
                echo '```'
                tail -50 <<<"${out}"
                echo '```'
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          # 存量问题不让任务失败;工具自身失败必须失败,否则这个汇总会静默失效
          [ "${code}" -le 1 ] || exit "${code}"
