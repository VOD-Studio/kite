# 定时任务:跟踪「没改代码也会变化」的外部状态,与 PR 门禁(ci.yml)解耦。
#
#   - vuln:每日全量 govulncheck。漏洞库更新会让无关 PR 变红,所以 PR 门禁只在依赖变化时才拦
#     (见 ci.yml 的 vuln job),全量扫描放这里;失败时开 / 更新一个 issue 提醒,不阻塞任何 PR。

name: Scheduled

on:
  schedule:
    - cron: "17 2 * * *"   # 每天 UTC 02:17(错开整点高峰)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vuln:
    name: Full vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write   # 失败时开 / 更新 issue
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install govulncheck
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      - name: govulncheck 门禁
        id: scan
        run: make vuln
      - name: 失败时开 / 更新 issue
        if: failure() && steps.scan.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="[security] 依赖存在可修复的漏洞"
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          body="定时全量扫描发现可修复的漏洞,详情见运行日志: ${RUN_URL}"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
