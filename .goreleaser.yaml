version: 2

project_name: kite

builds:
  # ---- CLI:跨平台二进制(linux/darwin/windows × amd64/arm64)----
  - id: cli
    main: ./cmd/kite
    binary: kite
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w   # strip 调试信息减小体积;version 走 debug.ReadBuildInfo,无需 -X
    mod_timestamp: "{{ .CommitTimestamp }}"

  # ---- server:linux / darwin / windows × amd64/arm64 ----
  # 镜像只用其中的 linux 产物(dockers_v2 按 platforms 过滤);darwin / windows 二进制
  # 供其它语言(Rust 等)的桌面应用把 server 当 sidecar 随应用分发,无需 Docker。
  - id: server
    main: ./cmd/server
    binary: server
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: deploy-probe
    main: ./cmd/kite-probe
    binary: kite-probe
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath, -buildvcs=false]
    ldflags: [-s -w]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: cli
    ids: [cli]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin"}}macOS
      {{- else}}{{ .Os }}{{end}}_{{ .Arch }}

  - id: server
    ids: [server]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}-server_{{ .Version }}_
      {{- if eq .Os "darwin"}}macOS
      {{- else}}{{ .Os }}{{end}}_{{ .Arch }}

dockers_v2:
  - id: server-image
    ids: [server, deploy-probe]
    images:
      - "ghcr.io/vod-studio/kite-server"
    tags:
      - "{{ .Tag }}"
    dockerfile: Dockerfile.release
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: true
    labels:
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"

# 按 digest 签名(与 goreleaser 默认参数一致):只写 ${artifact} 时 cosign 会警告「按 tag 而不是 digest
# 标识镜像」——tag 可变,签名对象应是不可变的 digest。dockers_v2 为每个镜像 artifact 填充 digest(见发布日志
# 的 "created images ... digest=sha256:..."),同一次构建的多个 tag 指向同一个 digest。
docker_signs:
  - cmd: cosign
    output: true
    args:
      - "sign"
      - "${artifact}@${digest}"
      - "--yes"

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# Release Please owns release notes; never generate a competing changelog.
changelog:
  disable: true

release:
  github: {}
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true
  make_latest: false
  mode: keep-existing
  prerelease: false
